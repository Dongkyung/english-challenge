<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>녹음 리스트 — Speaking Practice Challenge</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="list-page">
  <main class="list-screen">
    <header class="list-header">
      <h1 class="list-title">Speaking Practice Challenge</h1>
      <button id="logout-btn" class="link-btn" type="button">로그아웃</button>
    </header>

    <div class="list-toolbar">
      <label for="week-select" class="toolbar-label">주차</label>
      <select id="week-select"></select>

      <a id="record-link" class="record-link-btn" href="record.html" hidden>오늘의 녹음하기</a>
    </div>

    <p id="list-error" class="error-msg" hidden></p>
    <p id="list-loading" class="hint">불러오는 중...</p>

    <div id="list-content" class="list-content"></div>
  </main>

  <div id="player-bar" class="player-bar" hidden>
    <div class="player-row">
      <button id="player-toggle" class="player-toggle" type="button" aria-label="재생/일시정지">
        <span id="player-toggle-icon"></span>
      </button>

      <div class="player-main">
        <p id="player-label" class="player-label"></p>
        <div class="player-seek-row">
          <span id="player-current-time" class="player-time">0:00</span>
          <input id="player-seek" class="player-seek" type="range" min="0" max="1000" value="0" />
          <span id="player-duration" class="player-time">0:00</span>
        </div>
      </div>
    </div>

    <div class="player-speed-row">
      <span class="player-speed-label">배속</span>
      <button class="speed-btn" type="button" data-rate="1">1x</button>
      <button class="speed-btn" type="button" data-rate="0.75">0.75x</button>
      <button class="speed-btn" type="button" data-rate="0.5">0.5x</button>
      <button class="speed-btn" type="button" data-rate="0.25">0.25x</button>
    </div>
  </div>

  <script type="module" src="list.js"></script>
</body>
</html>
